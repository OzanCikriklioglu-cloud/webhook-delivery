spring:
  application:
    name: webhook-delivery

  config:
    import: optional:file:.env.properties

  datasource:
    url: jdbc:postgresql://localhost:5432/webhookdb
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
    username: guest
    password: guest

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

webhook:
  delivery:
    timeout-seconds: 30
    max-retries: 3
    retry-delays:
      - 60000    # 1 minute
      - 300000   # 5 minutes
      - 1800000  # 30 minutes

logging:
  level:
    root: INFO
    org.example.webhookdelivery: DEBUG
    org.springframework.security: INFO

server:
  port: 8080