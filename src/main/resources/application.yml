spring:
  application:
    name: webhook-delivery

  config:
    import: optional:file:.env.properties

  datasource:
    url: jdbc:postgresql://localhost:5432/webhookdb
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: user
    password: pass

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

webhook:
  delivery:
    retry-delays: 60000,300000,1800000
    max-retries: 3
    timeout-seconds: 30

logging:
  level:
    root: INFO
    org.example.webhookdelivery: DEBUG
    org.springframework.security: INFO

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

info:
  app:
    name: Webhook Delivery
    description: Production-grade async webhook delivery engine with retry and dead-letter queue
    version: 1.0.0